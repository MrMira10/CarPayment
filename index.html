<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ניהול תקציב חודשי ומעקב רכב</title>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --accent-green: #22c55e;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Rubik', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 16px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 650px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        header {
            text-align: center;
            padding: 10px 0;
        }

        header h1 {
            font-size: 1.6rem;
            color: var(--accent-color);
            margin-bottom: 4px;
        }

        header p {
            color: var(--text-sub);
            font-size: 0.9rem;
        }

        /* כרטיסיית יתרת פתיחה בבנק */
        .main-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-group label {
            font-size: 0.9rem;
            color: var(--text-sub);
        }

        .input-group input {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 500;
            outline: none;
        }

        .input-group input:focus {
            border-color: var(--accent-color);
        }

        .bank-summary {
            background-color: rgba(56, 189, 248, 0.1);
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 12px;
            padding: 14px;
            text-align: center;
        }

        .bank-summary-title {
            font-size: 0.85rem;
            color: var(--text-sub);
        }

        .bank-summary-amount {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent-color);
            margin-top: 4px;
        }

        /* סרגל התקדמות ויתרת חוב */
        .progress-section {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
            color: var(--text-sub);
        }

        .debt-left {
            color: var(--accent-color);
            font-weight: 700;
        }

        .progress-bar-bg {
            background-color: var(--bg-color);
            height: 12px;
            border-radius: 6px;
            overflow: hidden;
        }

        .progress-bar-fill {
            background: linear-gradient(90deg, #38bdf8, #22c55e);
            height: 100%;
            width: 0%;
            transition: width 0.3s ease;
        }

        /* רשימת תשלומים חודשית */
        .payments-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .payment-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            transition: all 0.2s ease;
        }

        .payment-card.completed {
            border-color: rgba(34, 197, 94, 0.4);
            background-color: rgba(34, 197, 94, 0.04);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .payment-date {
            font-weight: 700;
            font-size: 1.05rem;
        }

        .payment-fixed {
            font-size: 0.85rem;
            color: var(--text-sub);
        }

        .card-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            align-items: center;
        }

        .salary-input {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
            width: 100%;
        }

        .salary-input:focus {
            border-color: var(--accent-color);
        }

        .month-result {
            background-color: rgba(255, 255, 255, 0.03);
            border-radius: 8px;
            padding: 8px;
            text-align: center;
        }

        .month-result-title {
            font-size: 0.75rem;
            color: var(--text-sub);
        }

        .month-result-amount {
            font-size: 1rem;
            font-weight: 700;
            color: var(--accent-green);
        }

        .checkbox-btn {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-sub);
            padding: 10px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            width: 100%;
            text-align: center;
        }

        .payment-card.completed .checkbox-btn {
            background-color: var(--accent-green);
            color: #000;
            border-color: var(--accent-green);
        }
    </style>
</head>

<body>

    <div class="container">
        <header>
            <h1>יומן משכורות ומעקב רכב</h1>
            <p>34 תשלומים • סיום ספטמבר 2029</p>
        </header>

        <!-- כרטיסיית יתרת פתיחה בבנק -->
        <div class="main-card">
            <div class="input-group">
                <label for="initialBank">יתרת פתיחה בבנק (עכשיו/התחלתית) ₪</label>
                <input type="number" id="initialBank" placeholder="הכנס סכום ראשוני..." oninput="updateAll()">
            </div>
            <div class="bank-summary">
                <div class="bank-summary-title">יתרת בנק מחושבת (כולל משכורות ששולמו והחזרי רכב)</div>
                <div class="bank-summary-amount" id="totalBankCalc">0 ₪</div>
            </div>
        </div>

        <!-- סרגל התקדמות ויתרת חוב -->
        <div class="progress-section">
            <div class="progress-header">
                <span id="progressText">0 מתוך 34 שולמו (0%)</span>
                <span class="debt-left" id="debtLeftText">יתרת חוב: 76,547.85 ₪</span>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progressBar"></div>
            </div>
        </div>

        <!-- רשימת חודשים -->
        <div class="payments-list" id="paymentsContainer"></div>
    </div>

    <script>
        const CAR_PAYMENT = 2251.41;
        const TOTAL_PAYMENTS = 34;
        const TOTAL_DEBT = TOTAL_PAYMENTS * CAR_PAYMENT; // 76,547.85 ₪

        function updateAll() {
            const initialBank = parseFloat(document.getElementById('initialBank').value) || 0;
            localStorage.setItem('initialBank', document.getElementById('initialBank').value);

            const savedSalaries = JSON.parse(localStorage.getItem('monthlySalaries') || '{}');
            const savedStates = JSON.parse(localStorage.getItem('completedPayments') || '{}');

            let currentBank = initialBank;
            let completedCount = 0;

            for (let i = 1; i <= TOTAL_PAYMENTS; i++) {
                const salary = parseFloat(savedSalaries[i]) || 0;
                const isCompleted = savedStates[i] || false;

                const leftFromSalary = salary > 0 ? salary - CAR_PAYMENT : 0;
                const salaryLeftElem = document.getElementById(`left-${i}`);
                if (salaryLeftElem) {
                    salaryLeftElem.innerText = leftFromSalary.toLocaleString('he-IL', { maximumFractionDigits: 2 }) + ' ₪';
                }

                if (isCompleted) {
                    completedCount++;
                    currentBank += (salary - CAR_PAYMENT);
                }
            }

            // חישוב יתרת החוב שנותרה
            const remainingDebt = TOTAL_DEBT - (completedCount * CAR_PAYMENT);

            // עדכון יתרת הבנק
            document.getElementById('totalBankCalc').innerText = currentBank.toLocaleString('he-IL', { maximumFractionDigits: 2 }) + ' ₪';

            // עדכון פס התקדמות ויתרת חוב
            const percentage = (completedCount / TOTAL_PAYMENTS) * 100;
            document.getElementById('progressBar').style.width = percentage + '%';
            document.getElementById('progressText').innerText = `${completedCount} מתוך ${TOTAL_PAYMENTS} שולמו (${percentage.toFixed(0)}%)`;
            document.getElementById('debtLeftText').innerText = `יתרת חוב: ${remainingDebt.toLocaleString('he-IL', { maximumFractionDigits: 2 })} ₪`;
        }

        function generatePayments() {
            const container = document.getElementById('paymentsContainer');
            const savedSalaries = JSON.parse(localStorage.getItem('monthlySalaries') || '{}');
            const savedStates = JSON.parse(localStorage.getItem('completedPayments') || '{}');

            let startDate = new Date(2026, 11, 10); // 10/12/2026
            container.innerHTML = '';

            for (let i = 1; i <= TOTAL_PAYMENTS; i++) {
                const isChecked = savedStates[i] || false;
                const salaryVal = savedSalaries[i] || '';
                const dateStr = startDate.toLocaleDateString('he-IL', { day: '2-digit', month: '2-digit', year: 'numeric' });

                const card = document.createElement('div');
                card.className = `payment-card ${isChecked ? 'completed' : ''}`;
                card.id = `card-${i}`;
                card.innerHTML = `
                    <div class="card-header">
                        <div class="payment-date">תשלום ${i} • ${dateStr}</div>
                        <div class="payment-fixed">יורד: 2,251.41 ₪</div>
                    </div>
                    <div class="card-inputs">
                        <div>
                            <input type="number" class="salary-input" id="salary-${i}" 
                                   placeholder="משכורת חודש זה (₪)" value="${salaryVal}" 
                                   oninput="saveSalary(${i})">
                        </div>
                        <div class="month-result">
                            <div class="month-result-title">נשאר בכיס מהמשכורת</div>
                            <div class="month-result-amount" id="left-${i}">0 ₪</div>
                        </div>
                    </div>
                    <button class="checkbox-btn" onclick="togglePayment(${i})">
                        ${isChecked ? '✓ תשלום בוצע והתעדכן בבנק' : 'סמן חודש זה כסגור'}
                    </button>
                `;
                container.appendChild(card);
                startDate.setMonth(startDate.getMonth() + 1);
            }

            updateAll();
        }

        function saveSalary(index) {
            const val = document.getElementById(`salary-${index}`).value;
            const savedSalaries = JSON.parse(localStorage.getItem('monthlySalaries') || '{}');
            savedSalaries[index] = val;
            localStorage.setItem('monthlySalaries', JSON.stringify(savedSalaries));
            updateAll();
        }

        function togglePayment(index) {
            const savedStates = JSON.parse(localStorage.getItem('completedPayments') || '{}');
            savedStates[index] = !savedStates[index];
            localStorage.setItem('completedPayments', JSON.stringify(savedStates));

            const card = document.getElementById(`card-${index}`);
            if (savedStates[index]) {
                card.classList.add('completed');
            } else {
                card.classList.remove('completed');
            }

            generatePayments();
        }

        window.onload = () => {
            if (localStorage.getItem('initialBank')) {
                document.getElementById('initialBank').value = localStorage.getItem('initialBank');
            }
            generate_payments_init = generatePayments();
        };
    </script>
</body>

</html>
